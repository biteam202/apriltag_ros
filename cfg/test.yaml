/**:
  ros__parameters:
    image_transport: raw        # 图像传输格式，一般用 raw
    family: 36h11               # AprilTag 标签家族，对应 tag36h11
    size: 0.160                 # 默认 Tag 边长，单位 m；160mm = 0.160m
    max_hamming: 0              # 最大纠错位数，0 表示最严格，误检少
    qos_profile: default        # QoS 配置，可选 default / sensor_data / system_default
 
    detector:
      threads: 4                # 检测线程数
      decimate: 1.0             # 图像降采样比例，1.0 精度高，2.0 速度快
      blur: 0.0                 # 高斯模糊参数，一般保持 0
      refine: True              # 是否细化角点，提高位姿精度
      sharpening: 0.25          # 图像锐化参数，默认 0.25 即可
      debug: False              # 是否输出调试图像，正常使用关闭
 
    pose_estimation_method: "pnp"   # 位姿估计方法，一般用 pnp
 
    tag:
      ids: [0]                  # 要识别的 Tag ID；00000 对应 ID 0
      frames: [tag_0]           # 检测到后发布的 TF frame 名
      sizes: [0.160]            # 该 Tag 的实际边长，单位 m